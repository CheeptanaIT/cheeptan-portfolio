name: Deploy to hosting via FTP

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write includes/local.env.php from secrets
        run: |
          cat > includes/local.env.php << 'PHP'
          <?php
          putenv('SMTP_HOST=${{ secrets.SMTP_HOST }}');
          putenv('SMTP_PORT=${{ secrets.SMTP_PORT }}');
          putenv('SMTP_USER=${{ secrets.SMTP_USER }}');
          putenv('SMTP_PASS=${{ secrets.SMTP_PASS }}');
          putenv('SMTP_FROM_EMAIL=${{ secrets.SMTP_FROM_EMAIL }}');
          PHP

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            schema.sql
            blog.php
            blog-post.php
            includes/db.php
