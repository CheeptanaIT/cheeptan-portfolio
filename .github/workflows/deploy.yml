name: Deploy to hosting via FTP

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write includes/local.env.php from secrets
        run: |
          cat > includes/local.env.php << 'PHP'
          <?php
          // putenv() ถูกปิดไว้บน InfinityFree (disable_functions) จึง return
          // array แทนแบบนี้ — อ่านผ่าน includes/env.php's env_get()
          return [
              'SMTP_HOST' => '${{ secrets.SMTP_HOST }}',
              'SMTP_PORT' => '${{ secrets.SMTP_PORT }}',
              'SMTP_USER' => '${{ secrets.SMTP_USER }}',
              'SMTP_PASS' => '${{ secrets.SMTP_PASS }}',
              'SMTP_FROM_EMAIL' => '${{ secrets.SMTP_FROM_EMAIL }}',
              'DB_HOST' => '${{ secrets.DB_HOST }}',
              'DB_NAME' => '${{ secrets.DB_NAME }}',
              'DB_USER' => '${{ secrets.DB_USER }}',
              'DB_PASS' => '${{ secrets.DB_PASS }}',
              'ADMIN_PASSWORD_HASH' => '${{ secrets.ADMIN_PASSWORD_HASH }}',
          ];
          PHP

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            schema.sql
